<head>
  <meta charset="UTF-8">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      line-height: 1.55;
      padding: 0 16px 80px;
    }
    .container { max-width: 760px; margin: 0 auto; }
    header { padding: 40px 0 20px; }
    .top-links { font-size: 0.9rem; margin-bottom: 16px; }
    .top-links a { color: #ccc; text-decoration: none; }
    .top-links a:hover { color: #fff; text-decoration: underline; }
    .top-links span { color: #555; margin: 0 8px; }
    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle { color: #aaa; font-size: 0.92rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0 10px;
      position: sticky;
      top: 10px;
      z-index: 20;
      background: rgba(15, 15, 15, 0.94);
      backdrop-filter: blur(8px);
      padding: 10px 0;
    }
    .search-wrap {
      flex: 1 1 220px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 0 14px;
      min-height: 46px;
    }
    .search-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 1rem;
    }
    .search-wrap input::placeholder { color: #777; }
    .btn {
      background: #252525;
      color: #fff;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 0 18px;
      min-height: 46px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: #2f2f2f; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .meta { color: #888; font-size: 0.88rem; margin-bottom: 16px; }
    .error { color: #f87171; font-size: 0.9rem; margin-bottom: 12px; }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .card h2 {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 650;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .flag {
      width: 36px;
      height: 24px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid #333;
      flex-shrink: 0;
      background: #111;
    }
    .agency { margin-top: 10px; padding-top: 10px; border-top: 1px solid #222; }
    .agency:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
    .agency-name { font-weight: 600; margin-bottom: 3px; color: #fff; }
    .agency-link { color: #888; font-size: 0.88rem; }
    .agency-link a {
      color: #ccc;
      word-break: break-all;
      text-decoration: none;
    }
    .agency-link a:hover { color: #fff; text-decoration: underline; }
    .empty {
      text-align: center;
      color: #888;
      padding: 40px 16px;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      background: #1a1a1a;
    }
    footer {
      text-align: center;
      margin-top: 36px;
      color: #555;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="top-links">
        <a href="https://venmo.com/u/StevenRamirez1998" target="_blank" rel="noopener">Venmo: @StevenRamirez1998</a>
        <span>·</span>
        <a href="https://buymeacoffee.com/lawfulexpat" target="_blank" rel="noopener">Buy Me a Coffee</a>
      </div>
      <h1>Resources to report illegal aliens &amp; other criminals in your country</h1>
      <p class="subtitle">Data loaded live from the Google Sheet · Edit the sheet, then refresh</p>
    </header>

    <div class="toolbar">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search country or agency..." autocomplete="off">
      </div>
      <button class="btn" id="refresh" type="button">Refresh data</button>
    </div>
    <p class="meta" id="meta">Loading…</p>
    <p class="error" id="error" hidden></p>
    <div id="list"></div>
    <footer>lawfulexpat · public interest directory</footer>
  </div>

  <script>
    const SHEET_ID = "1yfLF_lP4jylk96dpJiYgOTxkixhuLsTflooQJmWykTA";
    // JSONP endpoint avoids browser CORS blocks on the CSV export URL
    const SHEET_JSONP = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:__sheetCallback`;

    // ISO codes for current flags in power (flagcdn.com). Afghanistan uses Islamic Emirate white Shahada flag via Wikimedia.
    const FLAG_ISO = {
      "Afghanistan": null,
      "Albania": "al", "Andorra": "ad", "Argentina": "ar", "Armenia": "am",
      "Australia": "au", "Austria": "at", "Azerbaijan": "az", "Belarus": "by",
      "Belgium": "be", "Belize": "bz", "Bolivia": "bo", "Bosnia and Herzegovina": "ba",
      "Brazil": "br", "Bulgaria": "bg", "Cambodia": "kh", "Canada": "ca",
      "Chile": "cl", "China": "cn", "Colombia": "co", "Costa Rica": "cr",
      "Croatia": "hr", "Cuba": "cu", "Cyprus": "cy", "Czech Republic": "cz",
      "Denmark": "dk", "Dominican Republic": "do", "Ecuador": "ec", "El Salvador": "sv",
      "Estonia": "ee", "European Union": "eu", "Finland": "fi", "France": "fr",
      "Georgia": "ge", "Germany": "de", "Greece": "gr", "Guatemala": "gt",
      "Honduras": "hn", "Hong Kong": "hk", "Hungary": "hu", "Iceland": "is",
      "Indonesia": "id", "Iran": "ir", "Ireland": "ie", "Israel": "il",
      "Italy": "it", "Jamaica": "jm", "Japan": "jp", "Kazakhstan": "kz",
      "Kosovo": "xk", "Kyrgyzstan": "kg", "Latvia": "lv", "Liechtenstein": "li",
      "Lithuania": "lt", "Luxembourg": "lu", "Macau": "mo", "Malta": "mt",
      "Mexico": "mx", "Moldova": "md", "Monaco": "mc", "Mongolia": "mn",
      "Montenegro": "me", "Morocco": "ma", "Netherlands": "nl", "New Zealand": "nz",
      "Nicaragua": "ni", "North Korea": "kp", "Norway": "no", "Panama": "pa",
      "Paraguay": "py", "Peru": "pe", "Philippines": "ph", "Poland": "pl",
      "Portugal": "pt", "Romania": "ro", "Russia": "ru", "San Marino": "sm",
      "Serbia": "rs", "Singapore": "sg", "Slovakia": "sk", "Slovenia": "si",
      "South Africa": "za", "South Korea": "kr", "Spain": "es", "Sweden": "se",
      "Switzerland": "ch", "Taiwan": "tw", "Tajikistan": "tj", "Thailand": "th",
      "Turkey": "tr", "Ukraine": "ua", "United Kingdom": "gb", "United States": "us",
      "Uruguay": "uy", "Uzbekistan": "uz", "Venezuela": "ve", "Vietnam": "vn"
    };

    const AF_FLAG = "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Flag_of_the_Taliban.svg/330px-Flag_of_the_Taliban.svg.png";

    function flagSrc(country) {
      if (country === "Afghanistan") return AF_FLAG;
      const code = FLAG_ISO[country];
      if (!code) return null;
      return `https://flagcdn.com/w80/${code}.png`;
    }

    function cellValue(cell) {
      if (!cell) return "";
      if (cell.f != null && cell.f !== "") return String(cell.f).trim();
      if (cell.v == null) return "";
      return String(cell.v).trim();
    }

    function parseResourcesFromGviz(response) {
      if (!response || response.status !== "ok" || !response.table) {
        throw new Error("Sheet response was not OK.");
      }
      const rows = response.table.rows || [];
      // Find header row: contains Country + Agency labels
      let headerIndex = -1;
      let countryAt = -1, agencyAt = -1, urlAt = -1;
      for (let i = 0; i < Math.min(rows.length, 10); i++) {
        const cells = (rows[i].c || []).map(cellValue);
        const lower = cells.map((c) => c.toLowerCase());
        const cIdx = lower.findIndex((h) => h.includes("country"));
        const aIdx = lower.findIndex((h) => h.includes("agency"));
        if (cIdx >= 0 && aIdx >= 0) {
          headerIndex = i;
          countryAt = cIdx;
          agencyAt = aIdx;
          urlAt = lower.findIndex((h) => h.includes("link") || h.includes("tip") || h.includes("contact"));
          if (urlAt < 0) urlAt = Math.max(agencyAt + 1, 3);
          break;
        }
      }
      if (headerIndex < 0) throw new Error("Could not find the header row in the sheet.");

      const resources = [];
      for (let i = headerIndex + 1; i < rows.length; i++) {
        const cells = rows[i].c || [];
        const country = cellValue(cells[countryAt]);
        const agency = cellValue(cells[agencyAt]);
        let url = cellValue(cells[urlAt]);
        if (!country || !agency || !url) continue;
        if (!/^https?:\/\//i.test(url)) url = "https://" + url;
        resources.push({ country, agency, url });
      }
      return resources;
    }

    function groupAlphabetical(resources, query) {
      const needle = query.trim().toLowerCase();
      const filtered = needle
        ? resources.filter((r) =>
            `${r.country} ${r.agency} ${r.url}`.toLowerCase().includes(needle)
          )
        : resources;
      const map = new Map();
      for (const item of filtered) {
        if (!map.has(item.country)) map.set(item.country, []);
        map.get(item.country).push(item);
      }
      return [...map.entries()]
        .sort((a, b) => a[0].localeCompare(b[0], "en", { sensitivity: "base" }))
        .map(([country, items]) => ({ country, items }));
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function render(groups, total, loadedAt) {
      const list = document.getElementById("list");
      const meta = document.getElementById("meta");
      const count = groups.reduce((n, g) => n + g.items.length, 0);
      const when = loadedAt.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
      meta.textContent = `Loaded ${count} resource${count === 1 ? "" : "s"} · ${when}`;

      if (!groups.length) {
        list.innerHTML = `<div class="empty">No agencies match that search.</div>`;
        return;
      }

      list.innerHTML = groups.map((g) => {
        const src = flagSrc(g.country);
        const flag = src
          ? `<img class="flag" src="${escapeHtml(src)}" alt="" width="36" height="24" loading="lazy">`
          : `<span class="flag" aria-hidden="true"></span>`;
        const agencies = g.items.map((item) => `
          <div class="agency">
            <div class="agency-name">${escapeHtml(item.agency)}</div>
            <div class="agency-link">Tip form/contact: <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.url)}</a></div>
          </div>
        `).join("");
        return `<article class="card"><h2>${flag}${escapeHtml(g.country)}</h2>${agencies}</article>`;
      }).join("");
    }

    let allResources = [];
    let loadedAt = new Date();
    let pendingScript = null;

    function load() {
      const btn = document.getElementById("refresh");
      const err = document.getElementById("error");
      btn.disabled = true;
      err.hidden = true;
      document.getElementById("meta").textContent = "Loading…";

      if (pendingScript && pendingScript.parentNode) {
        pendingScript.parentNode.removeChild(pendingScript);
      }

      const timeout = setTimeout(() => {
        err.hidden = false;
        err.textContent = "Timed out loading the Google Sheet. Check your connection and try Refresh.";
        document.getElementById("meta").textContent = "Failed to load";
        btn.disabled = false;
      }, 20000);

      window.__sheetCallback = function (response) {
        clearTimeout(timeout);
        try {
          allResources = parseResourcesFromGviz(response);
          loadedAt = new Date();
          render(
            groupAlphabetical(allResources, document.getElementById("search").value),
            allResources.length,
            loadedAt
          );
        } catch (e) {
          err.hidden = false;
          err.textContent = "Could not parse the Google Sheet. " + (e.message || "");
          document.getElementById("meta").textContent = "Failed to load";
        } finally {
          btn.disabled = false;
          if (pendingScript && pendingScript.parentNode) {
            pendingScript.parentNode.removeChild(pendingScript);
          }
          pendingScript = null;
        }
      };

      const script = document.createElement("script");
      script.src = SHEET_JSONP + "&_=" + Date.now();
      script.onerror = function () {
        clearTimeout(timeout);
        err.hidden = false;
        err.textContent = "Could not load the Google Sheet. Make sure it is shared as “Anyone with the link can view.”";
        document.getElementById("meta").textContent = "Failed to load";
        btn.disabled = false;
      };
      pendingScript = script;
      document.body.appendChild(script);
    }

    document.getElementById("search").addEventListener("input", (e) => {
      render(groupAlphabetical(allResources, e.target.value), allResources.length, loadedAt);
    });
    document.getElementById("refresh").addEventListener("c
